<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PCP Forms — Admin</title><link rel="stylesheet" href="../css/common.css"><link rel="stylesheet" href="../css/admin.css">
<script>document.documentElement.dataset.theme=localStorage.getItem("pcp-theme")||"dark";</script></head>
<body class="theme-sync">
<div class="bg"></div>
<header class="topbar"><div class="container bar"><a class="brand" href="../"><img src="../../../asset/logo/txt.png"><div class="copy"><b>PERSONA</b><b>COMMUNITY</b><b>PLAYER</b></div></a><span class="badge">ADMIN ACCESS</span></div></header>
<main class="login-wrap">
  <section class="login-card card">
    <div class="eyebrow"><i></i> PCP FORM SYSTEM</div>
    <h1>Admin<br><span>Sign In.</span></h1>
    <p class="muted">Masuk menggunakan akun Firebase Authentication yang sudah terdaftar. Tidak ada registrasi dari halaman ini.</p>
    <form id="loginForm">
      <div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div>
      <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div>
      <button class="btn primary full" type="submit">SIGN IN TO ADMIN</button>
      <button class="link-btn" type="button" id="resetBtn">Lupa password?</button>
      <div id="error" class="error"></div>
    </form>
  </section>
</main>
<script type="module">
import {auth,onAuthStateChanged,signInWithEmailAndPassword,sendPasswordResetEmail} from "../js/firebase.js";
const form=document.querySelector("#loginForm"), error=document.querySelector("#error");
onAuthStateChanged(auth,u=>{if(u) location.href="./dashboard.html";});
form.addEventListener("submit",async e=>{e.preventDefault();error.textContent="";try{await signInWithEmailAndPassword(auth,email.value,password.value);location.href="./dashboard.html"}catch(err){error.textContent="Email atau password tidak valid.";console.error(err)}});
resetBtn.addEventListener("click",async()=>{if(!email.value)return error.textContent="Masukkan email terlebih dahulu.";try{await sendPasswordResetEmail(auth,email.value);error.textContent="Email reset password dikirim.";error.className="success"}catch(e){error.textContent="Tidak dapat mengirim reset password.";error.className="error"}});
</script>
<script>document.body.classList.toggle("light",(localStorage.getItem("pcp-theme")||"dark")==="light");</script></body></html>
