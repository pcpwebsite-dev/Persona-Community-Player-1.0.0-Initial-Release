<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PCP Forms — Responses</title><script>document.documentElement.dataset.theme=localStorage.getItem('pcp-theme')||'dark'</script><link rel="stylesheet" href="../css/common.css"><link rel="stylesheet" href="../css/admin.css"><link rel="stylesheet" href="../css/responses.css"></head><body><div class="bg"></div><header class="topbar"><div class="container response-bar"><a class="brand" href="builder.html"><img src="../../../asset/logo/txt.png"><div class="copy"><b>PCP FORMS</b><b>RESPONSES</b></div></a><div class="response-actions"><button class="btn theme-toggle" data-theme-toggle>THEME</button><button class="btn" id="exportBtn">EXPORT CSV</button><button class="btn" id="back">FORMS</button></div></div></header><main class="container response-page"><div class="response-head"><div><span class="badge">RESPONSE CENTER</span><h1 id="formTitle">Responses</h1><p id="formMeta" class="muted">Select a form to inspect submissions.</p></div><select id="formSelect"><option value="">Select form</option></select></div><nav class="response-tabs"><button class="active" data-view="summary">Summary</button><button data-view="question">Question</button><button data-view="individual">Individual</button></nav><section id="content" class="response-content"><div class="card empty">Pilih form untuk melihat response.</div></section></main>
<script type="module">
import{auth,db,onAuthStateChanged,collection,getDocs,doc,getDoc}from'../js/firebase.js';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let form=null,responses=[],view='summary';onAuthStateChanged(auth,u=>{if(!u)location.replace('./index.html');else init()});back.onclick=()=>location.href='builder.html';
async function init(){const fs=await getDocs(collection(db,'forms'));fs.docs.forEach(d=>{const o=document.createElement('option');o.value=d.id;o.textContent=d.data().title||d.id;formSelect.appendChild(o)});const q=new URLSearchParams(location.search).get('id');if(q){formSelect.value=q;await load()}}
formSelect.onchange=load;async function load(){const id=formSelect.value;if(!id)return;const f=await getDoc(doc(db,'forms',id));form=f.data();const rs=await getDocs(collection(db,'forms',id,'responses'));responses=rs.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>timestamp(b.submittedAt)-timestamp(a.submittedAt));formTitle.textContent=form.title||'Responses';formMeta.textContent=`${responses.length} response${responses.length===1?'':'s'} · ${form.published?'Published':'Draft'}`;render()}
function qs(){return form?.items?.filter(x=>x.kind==='question')||form?.questions||[]}function timestamp(v){if(typeof v==='number')return v;if(v?.toDate)return v.toDate().getTime();if(typeof v==='string')return Date.parse(v)||0;return 0}function date(v){const n=timestamp(v);return n?new Date(n).toLocaleString('id-ID'):'—'}function val(v){return Array.isArray(v)?v.join(', '):(v??'')}
function render(){if(!form)return;content.innerHTML=view==='summary'?summary():view==='question'?questionsView():individual();document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{window._person=+b.dataset.person;view='individual';syncTabs();render()})}
function summary(){const q=qs();return `<div class="response-metrics"><div class="card metric"><span>RESPONSES</span><strong>${responses.length}</strong><small>Total submissions</small></div><div class="card metric"><span>QUESTIONS</span><strong>${q.length}</strong><small>Questions in form</small></div><div class="card metric"><span>LATEST</span><strong class="date-strong">${responses[0]?date(responses[0].submittedAt):'—'}</strong><small>Last submission</small></div></div>${q.map((x,i)=>questionCard(x,i)).join('')||'<div class="card empty">Belum ada pertanyaan.</div>'}`}
function questionCard(q,i){const values=responses.map(r=>r.answers?.['q'+i]).filter(v=>v!==undefined&&v!==null&&v!=='');if(['single','dropdown','multi','scale'].includes(q.type)){const counts={};values.forEach(v=>(Array.isArray(v)?v:[v]).forEach(x=>counts[x]=(counts[x]||0)+1));const max=Math.max(1,...Object.values(counts));return `<article class="card answer-card"><h3>${esc(q.title)}</h3><p>${values.length} responses</p><div class="bars">${Object.entries(counts).map(([k,n])=>`<div class="bar-row"><div><span>${esc(k)}</span><b>${n}</b></div><i><em style="width:${n/max*100}%"></em></i></div>`).join('')||'<span class="muted">No responses</span>'}</div></article>`}return `<article class="card answer-card"><h3>${esc(q.title)}</h3><p>${values.length} responses</p><div class="text-answers">${values.slice(0,8).map(v=>`<div>${esc(val(v))}</div>`).join('')||'<span class="muted">No responses</span>'}${values.length>8?`<small>+ ${values.length-8} more responses</small>`:''}</div></article>`}
function questionsView(){const q=qs();return `<div class="question-table card"><div class="table-scroll"><table><thead><tr><th>Submitted</th>${form.settings?.collectEmail?'<th>Email</th>':''}${q.map(x=>`<th>${esc(x.title)}</th>`).join('')}</tr></thead><tbody>${responses.map((r,ri)=>`<tr data-person="${ri}"><td>${date(r.submittedAt)}</td>${form.settings?.collectEmail?`<td>${esc(r.email||r.answers?.email||'')}</td>`:''}${q.map((x,i)=>`<td>${esc(val(r.answers?.['q'+i]))}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`}
function individual(){if(!responses.length)return '<div class="card empty">Belum ada response.</div>';let i=Math.min(window._person||0,responses.length-1),r=responses[i],q=qs();return `<div class="individual-nav"><button class="btn" id="prevPerson" ${i===0?'disabled':''}>←</button><span>Response ${i+1} of ${responses.length}</span><button class="btn" id="nextPerson" ${i===responses.length-1?'disabled':''}>→</button></div><article class="card individual-card"><div class="individual-head"><div><b>Submitted</b><span>${date(r.submittedAt)}</span></div>${form.settings?.collectEmail?`<div><b>Email</b><span>${esc(r.email||'—')}</span></div>`:''}</div>${q.map((x,j)=>`<div class="individual-answer"><label>${esc(x.title)}</label><div>${esc(val(r.answers?.['q'+j])||'—')}</div></div>`).join('')}</article>`}
document.addEventListener('click',e=>{if(e.target.id==='prevPerson'){window._person=Math.max(0,(window._person||0)-1);render()}if(e.target.id==='nextPerson'){window._person=Math.min(responses.length-1,(window._person||0)+1);render()}});function syncTabs(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;syncTabs();render()});
exportBtn.onclick=()=>{if(!form)return alert('Pilih form dulu.');const q=qs(),heads=['Submitted',...(form.settings?.collectEmail?['Email']:[]),...q.map(x=>x.title)],lines=[heads.map(csv).join(',')];responses.forEach(r=>lines.push([date(r.submittedAt),...(form.settings?.collectEmail?[r.email||'']:[]),...q.map((x,i)=>val(r.answers?.['q'+i]))].map(csv).join(',')));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}));a.download=(form.title||'pcp-form').replace(/[^a-z0-9]+/gi,'_')+'_responses.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};function csv(x){return '"'+String(x??'').replaceAll('"','""')+'"'}
</script></body></html>
