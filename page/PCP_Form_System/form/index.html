<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PCP Form</title><script>document.documentElement.dataset.theme=localStorage.getItem('pcp-theme')||'dark'</script><link rel="stylesheet" href="../css/common.css"><link rel="stylesheet" href="../css/form.css"></head><body><div class="bg"></div><header class="topbar"><div class="container form-bar"><a class="brand" href="../../../index.html"><img src="../../../asset/logo/txt.png"><div class="copy"><b>PERSONA</b><b>COMMUNITY</b><b>PLAYER</b></div></a><button class="btn icon-btn" data-theme-toggle type="button">THEME</button></div></header><main class="public-wrap container"><div id="progressWrap" class="progress-wrap hidden"><div id="progressBar"></div><span id="progressText"></span></div><section id="formView"></section><section id="success" class="success-card card hidden"><div class="success-icon">✓</div><h1>Response recorded.</h1><p id="successMessage"></p><button class="btn primary" id="another">SUBMIT ANOTHER RESPONSE</button></section></main>
<script type="module">import{db,doc,getDoc,collection,addDoc,serverTimestamp}from'../js/firebase.js';const id=new URLSearchParams(location.search).get('id'),root=document.querySelector('#formView');let formData,pages=[],page=0,answers={};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));load();
async function load(){if(!id)return unavailable('Form ID tidak ditemukan.');const s=await getDoc(doc(db,'forms',id));if(!s.exists()||!s.data().published)return unavailable('Form belum dipublish atau sudah tidak tersedia.');formData=s.data();buildPages();renderPage()}
function unavailable(t){root.innerHTML=`<div class="card empty"><h1>Form unavailable</h1><p>${esc(t)}</p></div>`}
function buildPages(){let items=formData.items||((formData.questions||[]).map((q,i)=>({kind:'question',...q,_qi:i})));let qi=0;items=items.map(x=>x.kind==='question'?{...x,_qi:qi++}:x);if(formData.settings?.shuffleQuestions){const q=items.filter(x=>x.kind==='question').sort(()=>Math.random()-.5),non=items.filter(x=>x.kind!=='question');if(non.some(x=>x.kind==='section')){/* preserve sections when present */}else items=[...non,...q]}pages=[{title:formData.title,description:formData.description,items:[]}];items.forEach(x=>{if(x.kind==='section')pages.push({title:x.title,description:x.description,items:[]});else pages.at(-1).items.push(x)})}
function renderPage(){const p=pages[page],first=page===0;root.innerHTML=`<form id="response"><section class="public-header card"><span class="badge published">PCP FORM${pages.length>1?` · SECTION ${page+1} OF ${pages.length}`:''}</span><h1>${esc(p.title||formData.title)}</h1><p>${esc(p.description||'')}</p>${first&&formData.settings?.collectEmail?`<div class="email-block"><label>Email <b>*</b></label><input name="__email" type="email" required value="${esc(answers.__email||'')}" placeholder="Your email"></div>`:''}</section><div class="public-form">${p.items.map(item).join('')}</div><div class="form-nav">${page?'<button class="btn" type="button" id="prev">BACK</button>':''}<button class="btn primary" type="submit">${page===pages.length-1?'SUBMIT':'NEXT'}</button><button class="clear-btn" type="button" id="clear">Clear form</button></div></form>`;restore();document.querySelector('#response').onsubmit=next;document.querySelector('#prev')?.addEventListener('click',()=>{capture();page--;renderPage()});document.querySelector('#clear').onclick=()=>{answers={};renderPage()};progress()}
function item(x){if(x.kind==='title')return `<div class="question card title-block"><h2>${esc(x.title)}</h2><p>${esc(x.description||'')}</p></div>`;const i=x._qi,req=x.required?'required':'';let input='';if(x.type==='short')input=`<input name="q${i}" ${req} placeholder="Your answer">`;if(x.type==='paragraph')input=`<textarea name="q${i}" ${req} placeholder="Your answer"></textarea>`;if(x.type==='email')input=`<input name="q${i}" type="email" ${req} placeholder="name@example.com">`;if(x.type==='number')input=`<input name="q${i}" type="number" ${req}>`;if(x.type==='date')input=`<input name="q${i}" type="date" ${req}>`;if(x.type==='time')input=`<input name="q${i}" type="time" ${req}>`;if(x.type==='single')input=(x.options||[]).map(o=>`<label class="choice"><input type="radio" name="q${i}" value="${esc(o)}" ${req}><span>${esc(o)}</span></label>`).join('');if(x.type==='multi')input=(x.options||[]).map(o=>`<label class="choice"><input type="checkbox" name="q${i}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join('');if(x.type==='dropdown')input=`<select name="q${i}" ${req}><option value="">Choose</option>${(x.options||[]).map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select>`;if(x.type==='scale'){let min=x.min??1,max=x.max??5;input=`<div class="scale-labels"><span>${esc(x.minLabel||'')}</span><span>${esc(x.maxLabel||'')}</span></div><div class="scale">${Array.from({length:max-min+1},(_,n)=>{let v=min+n;return `<label><span>${v}</span><input type="radio" name="q${i}" value="${v}" ${req}><i></i></label>`}).join('')}</div>`}return `<div class="question card"><label class="question-label">${esc(x.title)} ${x.required?'<b>*</b>':''}</label>${input}</div>`}
function capture(){const f=new FormData(document.querySelector('#response'));for(const [k,v] of f){if(k==='__email')answers.__email=v;else if(k.startsWith('q')){if(document.querySelectorAll(`[name="${k}"][type="checkbox"]`).length){answers[k]=f.getAll(k)}else answers[k]=v}}}
function restore(){for(const[k,v]of Object.entries(answers)){const els=document.querySelectorAll(`[name="${CSS.escape(k)}"]`);els.forEach(el=>{if(el.type==='radio'||el.type==='checkbox')el.checked=(Array.isArray(v)?v:[v]).includes(el.value);else el.value=v})}}
async function next(e){e.preventDefault();capture();if(page<pages.length-1){page++;renderPage();scrollTo({top:0,behavior:'smooth'});return}const payload={answers:Object.fromEntries(Object.entries(answers).filter(([k])=>k.startsWith('q'))),submittedAt:serverTimestamp(),formVersion:formData.updatedAt||null};if(formData.settings?.collectEmail)payload.email=answers.__email||'';try{await addDoc(collection(db,'forms',id,'responses'),payload);root.classList.add('hidden');progressWrap.classList.add('hidden');success.classList.remove('hidden');successMessage.textContent=formData.settings?.confirmationMessage||'Terima kasih atas respons Anda.'}catch(err){alert('Gagal mengirim response. Silakan coba lagi.');console.error(err)}}
function progress(){if(!formData.settings?.showProgress){progressWrap.classList.add('hidden');return}progressWrap.classList.remove('hidden');const n=Math.round(((page+1)/pages.length)*100);progressBar.style.width=n+'%';progressText.textContent=n+'%'}another.onclick=()=>{answers={};page=0;success.classList.add('hidden');root.classList.remove('hidden');renderPage()};
</script></body></html>
