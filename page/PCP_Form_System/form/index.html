<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PCP Form</title><link rel="stylesheet" href="../css/common.css"><link rel="stylesheet" href="../css/form.css"></head>
<body>
<div class="bg"></div><header class="topbar"><div class="container form-bar"><a class="brand" href="#"><img src="../../../asset/logo/txt.png"><div class="copy"><b>PERSONA</b><b>COMMUNITY</b><b>PLAYER</b></div></a><button class="btn icon-btn" id="theme" type="button" aria-label="Toggle theme">◐</button></div></header>
<main class="public-wrap container">
<section id="formView"></section>
<section id="success" class="success-card card hidden"><div class="success-icon">✓</div><h1>Response <span>recorded.</span></h1><p id="successMessage"></p><button class="btn primary" onclick="location.reload()">SUBMIT ANOTHER RESPONSE</button></section>
</main>
<script type="module">
import {db,doc,getDoc,collection,addDoc,serverTimestamp} from "../js/firebase.js";
const id=new URLSearchParams(location.search).get("id");let formData;
const themeButton=document.querySelector("#theme");
const storedTheme=localStorage.getItem("pcp-theme")||"dark";
document.body.classList.toggle("light",storedTheme==="light");
themeButton.onclick=()=>{const next=document.body.classList.contains("light")?"dark":"light";document.body.classList.toggle("light",next==="light");localStorage.setItem("pcp-theme",next);};
const root=document.querySelector("#formView");
load();
async function load(){if(!id){root.innerHTML="<div class='card empty'>Form ID tidak ditemukan.</div>";return}const s=await getDoc(doc(db,"forms",id));if(!s.exists()||!s.data().published){root.innerHTML="<div class='card empty'><h1>Form unavailable.</h1><p>Form belum dipublish atau sudah tidak tersedia.</p></div>";return}formData=s.data();render()}
function render(){const f=formData;root.innerHTML=`<section class="public-header card"><span class="badge published">PCP FORM</span><h1>${esc(f.title)}</h1><p>${esc(f.description||"")}</p></section><form id="response" class="public-form">${f.settings?.collectEmail?`<div class="question card"><label>Email <b>*</b></label><input id="__email" type="email" required placeholder="nama@email.com"></div>`:""}${(f.questions||[]).map((q,i)=>question(q,i)).join("")}<button class="btn primary submit" type="submit">SUBMIT RESPONSE</button><p class="privacy">Your response is securely stored in PCP Firestore.</p></form>`;document.querySelector("#response").onsubmit=submit}
function question(q,i){const req=q.required?"required":"";let input="";if(q.type==="short")input=`<input name="q${i}" ${req} placeholder="Your answer">`;if(q.type==="paragraph")input=`<textarea name="q${i}" ${req} placeholder="Your answer"></textarea>`;if(q.type==="email")input=`<input name="q${i}" type="email" ${req} placeholder="name@example.com">`;if(q.type==="number")input=`<input name="q${i}" type="number" ${req}>`;if(q.type==="date")input=`<input name="q${i}" type="date" ${req}>`;if(q.type==="time")input=`<input name="q${i}" type="time" ${req}>`;if(q.type==="single")input=(q.options||[]).map(o=>`<label class="choice"><input type="radio" name="q${i}" value="${esc(o)}" ${req}><span>${esc(o)}</span></label>`).join("");if(q.type==="multi")input=(q.options||[]).map(o=>`<label class="choice"><input type="checkbox" name="q${i}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join("");if(q.type==="dropdown")input=`<select name="q${i}" ${req}><option value="">Choose...</option>${(q.options||[]).map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join("")}</select>`;if(q.type==="scale"){const min=q.min??1,max=q.max??5;input=`<div class="scale">${Array.from({length:Math.min(10,max-min+1)},(_,n)=>{const v=min+n;return `<label><input type="radio" name="q${i}" value="${v}" ${req}><span>${v}</span></label>`}).join("")}</div>`}return `<div class="question card"><label>${i+1}. ${esc(q.title)} ${q.required?"<b>*</b>":""}</label>${input}</div>`}
async function submit(e){e.preventDefault();const data={};const fd=new FormData(e.target);for(let [k,v] of fd.entries()){if(k.startsWith("q")){if(data[k])data[k]=Array.isArray(data[k])?[...data[k],v]:[data[k],v];else data[k]=v}}if(formData.settings?.collectEmail)data.email=fd.get("__email");try{await addDoc(collection(db,"forms",id,"responses"),{answers:data,submittedAt:serverTimestamp(),userAgent:navigator.userAgent,formVersion:formData.updatedAt||null});document.querySelector(".public-form").remove();document.querySelector("#success").classList.remove("hidden");document.querySelector("#successMessage").textContent=formData.settings?.confirmationMessage||"Terima kasih atas respons Anda."}catch(err){alert("Gagal mengirim response. Silakan coba lagi.");console.error(err)}}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
</script>
</body></html>
